<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Offer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .option-btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .option-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .result {
            display: none;
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
            animation: fadeIn 0.5s ease;
        }
        
        .result.show {
            display: block;
        }
        
        .sarcastic-text {
            font-size: 3em;
            font-weight: bold;
            color: #764ba2;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }
        
        .subtext {
            font-size: 1.2em;
            color: #666;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="questionSection">
            <h1>🎯 Choose Your Preference</h1>
            <div class="options">
                <button class="option-btn" onclick="showNext(1)">Premium Service ✨</button>
                <button class="option-btn" onclick="showNext(1)">Exclusive Access 🔑</button>
                <button class="option-btn" onclick="showNext(1)">VIP Experience 👑</button>
                <button class="option-btn" onclick="showNext(1)">Elite Membership 💎</button>
                <button class="option-btn" onclick="showNext(1)">Luxury Package 🏆</button>
            </div>
        </div>
        
        <div id="secondQuestion" class="hidden">
            <h1>💰 Select Your Budget Range</h1>
            <div class="options">
                <button class="option-btn" onclick="showNext(2)">₹10,000 - ₹50,000</button>
                <button class="option-btn" onclick="showNext(2)">₹50,000 - ₹1,00,000</button>
                <button class="option-btn" onclick="showNext(2)">₹1,00,000 - ₹5,00,000</button>
                <button class="option-btn" onclick="showNext(2)">₹5,00,000+</button>
                <button class="option-btn" onclick="showNext(2)">Money is no object 💸</button>
            </div>
        </div>
        
        <div id="thirdQuestion" class="hidden">
            <h1>⏰ When do you need this?</h1>
            <div class="options">
                <button class="option-btn" onclick="showResult()">Immediately</button>
                <button class="option-btn" onclick="showResult()">Within a week</button>
                <button class="option-btn" onclick="showResult()">Within a month</button>
                <button class="option-btn" onclick="showResult()">Flexible timeline</button>
                <button class="option-btn" onclick="showResult()">Yesterday 😅</button>
            </div>
        </div>
        
        <div id="result" class="result">
            <div class="sarcastic-text">बड़े लोग 🧐</div>
            <div class="subtext">
                Itni choices ke baad yahi milna tha! 😏<br>
                ! 
            </div>
        </div>
    </div>
    
    <script>
        function showNext(step) {
            if (step === 1) {
                document.getElementById('questionSection').classList.add('hidden');
                document.getElementById('secondQuestion').classList.remove('hidden');
            } else if (step === 2) {
                document.getElementById('secondQuestion').classList.add('hidden');
                document.getElementById('thirdQuestion').classList.remove('hidden');
            }
        }
        
        function showResult() {
            document.getElementById('thirdQuestion').classList.add('hidden');
            document.getElementById('result').classList.add('show');
        }
    </script>
</body>
</html>
